[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-module"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "PyYAML",
    "httpx",
    "tenacity",
]

[project.optional-dependencies]
# 이미지별 선택 의존성 — 계획서 6.1절
# 한 단계의 라이브러리 갱신이 다른 이미지에 번지지 않게 한다
collector = [
    "httpx[http2]",
    "boto3",         # S3 원문 저장소 (2.3절, 개정 22)
    "nats-py",       # NATS JetStream 단계 간 알림 (2.2절, 개정 22)
]
processor = [
    "SQLAlchemy>=2.0",   # DB 접근 계층 (common/repository/, 5.4절)
    "lxml",
    "jsonschema",   # 운영 조정 기동 시 스키마 검사 (2.0.6절)
    "boto3",         # S3 원문 저장소 읽기 (2.3절, 개정 22)
    "nats-py",       # NATS JetStream 단계 간 알림 (2.2절, 개정 22)
]
interpolation = [
    "SQLAlchemy>=2.0",
    "numpy",
    "scipy",
    "nats-py",       # NATS JetStream 단계 간 알림 (2.2절, 개정 22)
]
evaluation = [
    "SQLAlchemy>=2.0",
    "jsonschema",   # 운영 조정 기동 시 스키마 검사·gate (2.0.6절)
    "nats-py",       # NATS JetStream 단계 간 알림 (2.2절, 개정 22)
]
grading = [
    "SQLAlchemy>=2.0",
    "nats-py",       # NATS JetStream 단계 간 알림 (2.2절, 개정 22)
]
# flowtest: 전 단계 의존성 합집합 — collector·processor·interpolation·grading·evaluation (2.1.1절, 개정 21)
flowtest = [
    "SQLAlchemy>=2.0",
    "httpx[http2]",
    "lxml",
    "jsonschema",
    "numpy",
    "scipy",
    "boto3",         # S3 원문 저장소 — collector·processor 의존성 합집합 (2.3절, 개정 22)
]
# collector: DB에 쓰지 않는다 (2.3절, 결정 D1) — SQLAlchemy 없음

# DB 드라이버 — 계획서 5.4절 (하나만 설치)
db-postgres = [
    "psycopg[binary]>=3.1",
]
db-mysql = [
    "PyMySQL>=1.1",
]

test = [
    "pytest>=8",
    "pytest-asyncio",
    "testcontainers[postgres]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

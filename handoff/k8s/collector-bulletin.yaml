# collector-bulletin CronJob — 계획서 2.1절
# 역할: redtideList 최근 30일 창(조사일 기준 필터 — 늦은 등록 속보를 덮도록, 계획서 개정 18) → 원문 → raw.fetched
# 전제: 적조 수집은 동시에 하나만 — 시즌·비시즌 CronJob을 함께 켜지 않는다(직전 원문 대조, 계획서 3.3절)
# 주기: 적조 시즌(5~10월) 1시간 / 비시즌 6시간
# axis_coverage.season_months 확정·변경 시 주기도 같이 조정 (계획서 7.7절)
#
# 방식 A: 두 CronJob으로 시즌/비시즌 분리 (인프라가 enable/disable)
# 방식 B: 단일 CronJob + 애플리케이션 내 계절 확인 — 팀·인프라 협의
# 아래는 방식 A 기준 (시즌용)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector-bulletin-season     # 시즌(5~10월): 1시간
  namespace: aquasentinel
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: collector-bulletin
              image: ${REGISTRY}/api-module/collector:latest
              command: ["python", "-m", "collector.main", "bulletin"]
              envFrom:
                - secretRef:
                    name: api-module-secrets
              env:
                # RAW_STORE_DSN — 객체 저장소 구현 이미지와 함께 켠다(계획서 11절 미결). 현재 이미지는 이 값이 있으면 기동을 멈춘다
                # - name: RAW_STORE_DSN
                #   valueFrom:
                #     secretKeyRef:
                #       name: api-module-secrets
                #       key: RAW_STORE_DSN
                - name: QUEUE_DSN
                  valueFrom:
                    secretKeyRef:
                      name: api-module-secrets
                      key: QUEUE_DSN
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector-bulletin-offseason  # 비시즌(11~4월): 6시간
  namespace: aquasentinel
spec:
  schedule: "0 */6 * * *"
  suspend: true                       # 기본 중단 — 시즌 종료 시 활성화
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: collector-bulletin
              image: ${REGISTRY}/api-module/collector:latest
              command: ["python", "-m", "collector.main", "bulletin"]
              envFrom:
                - secretRef:
                    name: api-module-secrets
              env:
                # RAW_STORE_DSN — 객체 저장소 구현 이미지와 함께 켠다(계획서 11절 미결). 현재 이미지는 이 값이 있으면 기동을 멈춘다
                # - name: RAW_STORE_DSN
                #   valueFrom:
                #     secretKeyRef:
                #       name: api-module-secrets
                #       key: RAW_STORE_DSN
                - name: QUEUE_DSN
                  valueFrom:
                    secretKeyRef:
                      name: api-module-secrets
                      key: QUEUE_DSN
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"

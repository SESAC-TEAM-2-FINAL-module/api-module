# api-module-secrets Secret 템플릿 — 실제 값은 인프라가 채운다
# 이 파일은 키 이름 목록만 제공 (값 없음 — 커밋 안전)
# 주의: 실제 Secret은 이 파일로 apply하지 않는다
apiVersion: v1
kind: Secret
metadata:
  name: api-module-secrets
  namespace: aquasentinel
type: Opaque
stringData:
  # data.go.kr 조위관측소 API (통합 인증키 1종 — 포털에서 발급받은 원문 그대로 입력)
  DTRECENT_KEY: "<인프라가 채움>"
  DTRECENT_URL: "https://apis.data.go.kr/1192136/dtRecent/GetDTRecentApiService"

  # NIFS API 3종 (nifs.go.kr 자체 키 — data.go.kr 키 호환 안 됨)
  NIFS_KEY_BULLETIN: "<인프라가 채움>"
  NIFS_KEY_LINE: "<인프라가 채움>"
  NIFS_KEY_FISHERY_SEA: "<인프라가 채움>"
  NIFS_URL: "https://www.nifs.go.kr/OpenAPI_json"

  # DB 연결 — PostgreSQL 또는 MySQL (확정된 쪽 선택)
  DATABASE_URL: "<인프라가 채움>"

  # 큐 연결 — NATS 또는 SQS (v1.5 10.3(b) 미결, 인터페이스는 common/queue/)
  QUEUE_DSN: "<인프라가 채움>"

  # 객체 저장소 연결 — S3/GCS/MinIO (v1.5 12.1절 미결)
  RAW_STORE_DSN: "<인프라가 채움>"

# collector-line CronJob — 계획서 2.1절
# 역할: sooList 1년 창 → 원문 → raw.fetched
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector-line
  namespace: aquasentinel
spec:
  schedule: "0 3 * * *"             # 1일 1회 새벽 3시 (UTC)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: collector-line
              image: ${REGISTRY}/api-module/collector:latest
              command: ["python", "-m", "collector.main", "line"]
              envFrom:
                - secretRef:
                    name: api-module-secrets
              env:
                # RAW_STORE_DSN — 객체 저장소 구현 이미지와 함께 켠다(계획서 11절 미결). 현재 이미지는 이 값이 있으면 기동을 멈춘다
                # - name: RAW_STORE_DSN
                #   valueFrom:
                #     secretKeyRef:
                #       name: api-module-secrets
                #       key: RAW_STORE_DSN
                - name: QUEUE_DSN
                  valueFrom:
                    secretKeyRef:
                      name: api-module-secrets
                      key: QUEUE_DSN
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "512Mi"

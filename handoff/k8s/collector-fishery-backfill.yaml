# collector-fishery-backfill Job — 계획서 2.1절
# 역할: femoSeaList 과거 연도 보관 (수동 1회 실행)
# 사용: kubectl apply -f collector-fishery-backfill.yaml
# 조건: 직전 연도부터 거슬러 올라가며 연속 2개 연도 0건이면 정지
apiVersion: batch/v1
kind: Job
metadata:
  name: collector-fishery-backfill
  namespace: aquasentinel
spec:
  backoffLimit: 0                    # 실패 시 재시도 없음 (수동 재실행)
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: collector-fishery-backfill
          image: ${REGISTRY}/api-module/collector:latest
          command: ["python", "-m", "collector.main", "fishery-backfill"]
          envFrom:
            - secretRef:
                name: api-module-secrets
          env:
            # RAW_STORE_DSN — 객체 저장소 구현 이미지와 함께 켠다(계획서 11절 미결). 현재 이미지는 이 값이 있으면 기동을 멈춘다
            # - name: RAW_STORE_DSN
            #   valueFrom:
            #     secretKeyRef:
            #       name: api-module-secrets
            #       key: RAW_STORE_DSN
            - name: QUEUE_DSN
              valueFrom:
                secretKeyRef:
                  name: api-module-secrets
                  key: QUEUE_DSN
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

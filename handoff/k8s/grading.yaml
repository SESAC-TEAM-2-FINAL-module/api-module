# grading Deployment — 계획서 2.1절
# 역할: obs.loaded(전 축) + interp.done(수온) 소비 → 출처 등급·alertable → 적재 → grade.done
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grading
  namespace: aquasentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grading
  template:
    metadata:
      labels:
        app: grading
    spec:
      containers:
        - name: grading
          image: ${REGISTRY}/api-module/grading:latest
          command: ["python", "-m", "grading.main"]
          envFrom:
            - secretRef:
                name: api-module-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-module-secrets
                  key: DATABASE_URL
            - name: QUEUE_DSN
              valueFrom:
                secretKeyRef:
                  name: api-module-secrets
                  key: QUEUE_DSN
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

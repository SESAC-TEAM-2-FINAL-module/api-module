# flowtest 한 번 실행 — 수집 4종 한 번 → 수온 오차 산출 → 침묵 점검 → 종료 요약 → 끝 (약 1~2분)
# 다시 돌리려면: kubectl delete job flowtest-once -n <네임스페이스> 후 다시 apply
# deployment-loop.yaml과 같은 DB에 동시에 돌리지 않는다 (중복 적재)
apiVersion: batch/v1
kind: Job
metadata:
  name: flowtest-once
  namespace: <네임스페이스>
  labels:
    app: flowtest
spec:
  backoffLimit: 0                 # 실행 전 점검에서 멈추면 재시도하지 않는다 — 로그로 원인을 본다
  ttlSecondsAfterFinished: 86400  # 끝난 뒤 하루 동안 로그 확인 가능
  template:
    metadata:
      labels:
        app: flowtest
        mode: once
    spec:
      restartPolicy: Never
      containers:
        - name: flowtest
          image: ryujaehee/aquasentinel-flowtest:2026-10-06
          args: ["--mode", "collect", "--run", "once"]
          envFrom:
            - secretRef:
                name: flowtest-secrets
          env:
            - name: OPERATIONAL_CONFIG_PATH
              value: /config/operational.yaml
            - name: RAW_STORE_PATH
              value: /data/raw
          volumeMounts:
            - name: operational-config
              mountPath: /config
              readOnly: true
            - name: raw
              mountPath: /data/raw
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1000m", memory: "1Gi"}
      volumes:
        - name: operational-config
          configMap:
            name: flowtest-operational
        - name: raw
          emptyDir: {}            # 원문을 남기려면 PVC로 바꾼다: persistentVolumeClaim: {claimName: flowtest-raw}

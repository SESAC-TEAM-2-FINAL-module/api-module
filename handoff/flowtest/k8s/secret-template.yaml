# flowtest 전용 Secret 양식 — 키 이름만 (값은 받는 쪽이 채운다)
# 운영 Secret(api-module-secrets)을 쓰지 않는다: RAW_STORE_DSN·QUEUE_DSN이 들어 있으면 실행기가 기동을 멈춘다
# 값을 채운 파일은 공유 저장소에 올리지 않는다. 권장: kubectl create secret generic ... --from-literal (README 4절)
apiVersion: v1
kind: Secret
metadata:
  name: flowtest-secrets
  namespace: <네임스페이스>
type: Opaque
stringData:
  # 시험 DB — postgresql+psycopg://<user>:<password>@<host>:5432/<db>
  DATABASE_URL: "<채움>"
  # 조위관측소 (data.go.kr)
  DTRECENT_URL: "https://apis.data.go.kr/1192136/dtRecent/GetDTRecentApiService"
  DTRECENT_KEY: "<채움>"
  # 국립수산과학원 3종
  NIFS_URL: "https://www.nifs.go.kr/OpenAPI_json"
  NIFS_KEY_BULLETIN: "<채움>"
  NIFS_KEY_LINE: "<채움>"
  NIFS_KEY_FISHERY_SEA: "<채움>"

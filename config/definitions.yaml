# config/definitions.yaml — 판정 정의 (이미지에 포함, CI 게이트 ① 대조)
# 계획서 2.0.6절 · 7.7절 · I-0 초판
# <미결> 값은 채우지 않는다 — 계획서 12.1절

version: definitions-v1

tide:
  stations:
    - DT_0014  # 통영
    - DT_0016  # 여수
    - DT_0029  # 거제도
    - DT_0061  # 삼천포
    - DT_0026  # 고흥발포
    - DT_0062  # 마산
    - DT_0063  # 가덕도
    - DT_0049  # 광양 (90일 0.000 — 관측소 미가동 판정, 수집은 계속)
    - DT_0092  # 여호항 (같음)

geo:
  lat_range: [33.0, 39.0]   # 폐구간 — 위도 33.0 포함 (계획서 1.4절)
  lng_range: [124.0, 132.0]

bulletin:
  species_allow:
    - Cochlodinium polykrikoides
    - Margalefidinium polykrikoides
  grade_thresholds: [10, 100, 1000]   # PRE_ADVISORY / ADVISORY / WARNING 경계
  current_window_days: 3               # 적조 현재값 유효 기간 — R1·R3 최대 간격 3일 (2026-09-30 채택)

line:
  cast_gap_minutes: 60       # 기본값 — 캐스트 키 X 검증 완료 (계획서 11절)
  surface_rule: INCLUDE        # 0m 레코드 채택 — 픽스처 1154 캐스트 전체 0m 1개씩 (2026-09-30 채택)

interpolation:
  method: M2                  # 기본값 — B2 승격 결정 대기 (계획서 11절)
  power_p: 2
  n_neighbors: 5              # 기본값
  align_window_min: 30        # 기본값 — 결정 대기 (계획서 11절)
  exclude_flatline: true        # STALE_SUSPECT 관측소 IDW 제외 (2026-09-30 채택)
  error_window_days: 30        # soo 픽스처 최근 30일 내 관측일 19일 — LOOCV 충분 (2026-09-30 채택)

grading:
  p95_thresholds:
    water_temp: [1.0, 2.0, 3.0]
  salinity_mode: NEAREST_TIDE        # NEAREST_TIDE / NONE (계획서 4.8절)
  chlorophyll_estimate_enabled: false
  line_max_distance_km: 30            # DO 정점 거리 한계 — 합성 양식장 최근접 29.4km (2026-09-30 채택)
  fishery_max_distance_km: 10        # 클로로필 정점 거리 한계 — 합성 양식장 최근접 1.2km (2026-09-30 채택)
  excluded_zones:                    # 중심·반경 목록 (계획서 4.7·4.8절)
    - name: seomjin_estuary
      center_lat: 35.00
      center_lng: 127.73
      radius_km: 15
  estuary_stations:                  # 하구 영향 관측소 — salinity_mode=NEAREST_TIDE 시 NONE 처리
    - DT_0016

quality:
  r1_salinity_min: 31.0
  r2_chlorophyll: {value: 10.0, delta: 5.0}
  r3_water_temp_range: [0, 35]
  r4_water_temp_delta_1h: 5.0
  r4_lookback_tolerance_min: 15.4   # R4 "1시간 전" 창 허용 — 관측소 최장 갱신 간격 (계획서 1.2·4.6절, 개정 13)
  r1_estuary_stations: <미결>         # R1 하구 예외 정점(정선·어장환경 station_id) — 미결 동안 예외 없음 (계획서 4.6·11절)

stale_threshold_hours:
  chlorophyll: null   # 게시 시계 규칙 — 판정 정의 (계획서 2.0.6절)

risk_index:
  weights:
    nearby_bulletin: <미결>
    water_temp_band: <미결>
    salinity_band: <미결>
    chlorophyll_level: <미결>
  factors:
    nearby_bulletin: <미결>
    water_temp_band: <미결>
    salinity_band: <미결>
    chlorophyll_level: <미결>
  min_factors_ok: <미결>
  levels: <미결>

contracts:
  queue: queue-v1
  tables: tables-v3          # 개정 20 — risk_index_factors·risk_index_levels·AXIS_VALS red_tide_risk 추가
  operational: operational-v1
